{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Sentiment Analysis</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<div class="container py-5">
    <div class="row justify-content-center">

        <div class="col-lg-11 col-xl-10">

            <div class="card shadow-lg border-0 overflow-hidden">

                <div class="row g-0">

                    <!-- Left Image -->
                    <div class="col-md-6">
                        <img src="{% static 'images/cat-work.jpg' %}"
                             class="img-fluid h-100 w-100 object-fit-cover"
                             alt="Product Review Analyzer">
                    </div>

                    <!-- Right Form -->
                    <div class="col-md-6 d-flex align-items-center">

                        <div class="card-body p-5 w-100">

                            <h2 class="text-center mb-3">
                                Product Review Sentiment Analysis
                            </h2>

                            <p class="text-center text-muted mb-4">
                                Enter one or two Daraz product URLs to compare customer sentiment.
                            </p>

                            <form method="POST">
                                {% csrf_token %}

                                <div class="mb-3">
                                    <label class="form-label">
                                        Product A URL (Required)
                                    </label>

                                    <input
                                        type="text"
                                        name="url_a"
                                        class="form-control"
                                        placeholder="Paste Product A URL"
                                        required>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label">
                                        Product B URL (Optional)
                                    </label>

                                    <input
                                        type="text"
                                        name="url_b"
                                        class="form-control"
                                        placeholder="Paste Product B URL">
                                </div>

                                <button
                                    type="submit"
                                    class="btn btn-primary w-100">
                                    Analyze Reviews
                                </button>

                            </form>

                            {% if error %}
                            <div class="alert alert-danger mt-4">
                                {{ error }}
                            </div>
                            {% endif %}

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
